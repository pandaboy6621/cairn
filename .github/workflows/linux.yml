# Builds Cairn's Linux release files on Ubuntu 26.04 (the swift:latest image) and,
# on a v* tag, adds them to the GitHub Release that release.yml creates:
#   cairn_<version>_amd64.deb and Cairn-<version>-x86_64.AppImage, each with a .sha256.
# Both need GNOME 50-era libraries (libadwaita 1.9): Ubuntu 26.04 or newer.
name: Linux

on:
  push:
    branches: [main, claude/linux-packages]
    tags: ["v*"] # path filters don't apply to tags
    paths:
      - "Sources/**"
      - "linux/**"
      - "scripts/package-linux.sh"
      - "Package.swift"
      - "Package.resolved"
      - ".github/workflows/linux.yml"
  workflow_dispatch:

permissions:
  contents: write # only used on tags, to add the files to the release

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container: swift:latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: |
          . /etc/os-release && echo "Building on $PRETTY_NAME"
          swift --version
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            libadwaita-1-dev libgtk-4-dev libsqlite3-dev pkg-config librsvg2-bin dpkg-dev desktop-file-utils gnupg file curl git >/dev/null

      - name: Install appimagetool
        run: |
          curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          # Pinned: a changed download fails the build.
          echo "46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1  /usr/local/bin/appimagetool" | sha256sum -c -
          chmod 755 /usr/local/bin/appimagetool

      - name: Test
        run: swift test

      - name: Package
        run: scripts/package-linux.sh all

      - name: Check the .deb installs and runs
        run: |
          dpkg-deb --info dist/cairn_*.deb
          dpkg-deb --contents dist/cairn_*.deb
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ./dist/cairn_*.deb >/dev/null
          cairn --version
          test -f /usr/share/applications/dev.cairn.Cairn.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/dev.cairn.Cairn.svg
          ! ldd /usr/bin/cairn-gnome | grep "not found"
          if [ -f linux/cairn-archive-keyring.asc ]; then
            test -f /usr/share/keyrings/cairn-archive-keyring.gpg
            grep -q "pandaboy6621.github.io/cairn/apt" /etc/apt/sources.list.d/cairn.sources
          fi
          file dist/*.AppImage

      - uses: actions/upload-artifact@v7
        with:
          name: Cairn-Linux
          path: dist/*
          if-no-files-found: error

      - name: Add to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apt-get install -y -qq gh >/dev/null 2>&1 || {
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /usr/share/keyrings/githubcli.gpg
            echo "deb [signed-by=/usr/share/keyrings/githubcli.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
            apt-get update -qq && apt-get install -y -qq gh >/dev/null
          }
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Cairn $tag" --notes "Cairn $tag. Notes follow when the Mac build finishes." --verify-tag || sleep 20
          fi
          gh release upload "$tag" dist/* --clobber

  # Cairn's apt repository on GitHub Pages: the installed .deb's source list points
  # here, so Software Updater brings new versions. Built (and checked with apt) on
  # every run from this build's .deb plus the newest releases' ones; published only
  # for a release. Needs the APT_SIGNING_KEY secret.
  apt-repo:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: Cairn-Linux
          path: new

      - name: Older releases' .debs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p old
          for tag in $(gh release list --exclude-drafts --exclude-pre-releases --limit 3 --json tagName --jq '.[].tagName'); do
            [ "$tag" = "$GITHUB_REF_NAME" ] && continue
            gh release download "$tag" --pattern 'cairn_*_amd64.deb' --dir old 2>/dev/null || true
          done
          ls -l new old

      - name: Build and sign the repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          sudo apt-get install -y -qq apt-utils gnupg >/dev/null
          scripts/build-apt-repo.sh site new/cairn_*_amd64.deb $(ls old/cairn_*_amd64.deb 2>/dev/null)

      - name: Check apt reads it
        run: |
          # A throwaway apt setup that knows only this repository, served from disk.
          root="$(mktemp -d)"
          mkdir -p "$root/etc/apt/sources.list.d" "$root/var/lib/apt/lists/partial" "$root/var/cache/apt/archives/partial" "$root/etc/apt/preferences.d"
          gpg --dearmor < linux/cairn-archive-keyring.asc > "$root/cairn.gpg"
          echo "deb [signed-by=$root/cairn.gpg] file://$PWD/site/apt stable main" > "$root/etc/apt/sources.list"
          touch "$root/var/lib/dpkg-status"
          opts="-o Dir=$root -o Dir::State::status=$root/var/lib/dpkg-status -o Dir::Etc::SourceParts=$root/etc/apt/sources.list.d"
          apt-get $opts update
          apt-cache $opts policy cairn

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # Publishes the repository, only for a release.
  pages:
    needs: apt-repo
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: apt-repo
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
