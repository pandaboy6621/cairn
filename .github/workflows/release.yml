# Builds Cairn.app on a GitHub macOS runner and publishes a GitHub Release.
# The same tag runs windows.yml, which adds the Windows app to the release.
#
# Release: bump `Cairn.version` in Sources/CairnCore/Cairn.swift, commit, then
#   git tag v0.1.0 && git push origin v0.1.0
# Or run it by hand from the Actions tab (workflow_dispatch) to test a build
# without publishing.
#
# Signing: the app is ad-hoc signed (as scripts/build-app.sh does locally), so
# macOS warns on first open. Developer ID signing and notarization come later,
# once there are certificates to store as repository secrets.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # create the release and upload its files

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Check the tag matches Cairn.version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/.*version = "\(.*\)".*/\1/p' Sources/CairnCore/Cairn.swift)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cairn.version ($version)"
            exit 1
          fi

      - name: Test
        run: swift test

      - name: Build Cairn.app
        run: scripts/build-app.sh

      - name: Package
        id: package
        run: |
          version="$(sed -n 's/.*version = "\(.*\)".*/\1/p' Sources/CairnCore/Cairn.swift)"
          name="Cairn-$version-macOS"
          ditto -c -k --keepParent --sequesterRsrc dist/Cairn.app "dist/$name.zip"
          (cd dist && shasum -a 256 "$name.zip" > "$name.zip.sha256")
          echo "zip=dist/$name.zip" >> "$GITHUB_OUTPUT"
          echo "sha=dist/$name.zip.sha256" >> "$GITHUB_OUTPUT"

      - name: Keep the build (for manual runs)
        uses: actions/upload-artifact@v7
        with:
          name: Cairn-app
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.sha }}

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Cairn $GITHUB_REF_NAME, built from $(git rev-parse --short HEAD).

          **Install:** unzip, move Cairn.app to Applications, then right-click it and choose Open the first time.
          This build is ad-hoc signed, not yet notarized, so macOS asks before opening it.
          If macOS says it's damaged, or Privacy & Security shows no Open Anyway button, run this in Terminal and open it again:
          \`xattr -dr com.apple.quarantine /Applications/Cairn.app\`

          From 0.2.3 on, Cairn updates itself (Settings → Updates), and **Cairn → Check for Updates…** checks on demand.
          Coming from 0.2.2 or earlier, install this one by hand once.

          The \`cairn\` command-line tool is inside the app: \`Cairn.app/Contents/MacOS/cairn\`.

          **Windows:** unzip the Windows-x64 zip anywhere and run Cairn.exe. It isn't code-signed yet, so
          SmartScreen warns the first time (More info, then Run anyway). It's added a few minutes after the Mac app.
          If there's no Run anyway button, run this in PowerShell (pointed at the folder you unzipped into) and try again:
          \`Get-ChildItem -Recurse "\$env:USERPROFILE\\Apps\\Cairn" | Unblock-File\`

          **Linux** (Ubuntu 26.04 or newer, added a few minutes after the Mac app):
          - **.deb:** open it and App Center installs Cairn into the app grid. It adds Cairn's software source,
            so new versions come with Software Updater.
          - **AppImage:** no install. In Files, right-click it, Properties, turn on Executable as Program, then
            double-click it. It adds itself to the app grid and updates itself from inside the app.
          EOF
          # The Windows build may have created the release first.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${{ steps.package.outputs.zip }}" "${{ steps.package.outputs.sha }}" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Cairn $GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              "${{ steps.package.outputs.zip }}" "${{ steps.package.outputs.sha }}" \
              --title "Cairn $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi
